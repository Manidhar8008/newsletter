<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e0f0f">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ '/' | relative_url }}">The AI Builder Dispatch</a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="{{ '/' | relative_url }}">Latest</a>
        <a href="{{ '/founder-story/' | relative_url }}">Founder</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch theme" title="Switch theme">
          <span class="theme-icon" aria-hidden="true">☼</span>
        </button>
        <button class="menu-btn" type="button" data-menu-toggle aria-controls="mobile-nav" aria-expanded="false" aria-label="Open menu">
          <span class="menu-icon" aria-hidden="true"></span>
        </button>
      </div>
    </div>
    <nav id="mobile-nav" class="mobile-nav" data-mobile-nav aria-label="Mobile navigation">
      <a href="{{ '/' | relative_url }}">Latest</a>
      <a href="{{ '/founder-story/' | relative_url }}">Founder</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div><strong>The AI Builder Dispatch</strong> · Manidhar Pati · Warangal, India</div>
    <div class="footer-links">
      <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
      <a href="https://github.com/Manidhar8008">GitHub</a>
    </div>
  </footer>

  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
