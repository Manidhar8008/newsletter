<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/' | relative_url }}">Latest</a>
      <a href="{{ '/founder-story/' | relative_url }}">Founder</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </nav>
  </header>
  <main class="container">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div>
      <strong>The AI Builder Dispatch</strong>
      <span> · Manidhar Pati · Warangal, India</span>
    </div>
    <div class="footer-links">
      <a href="{{ '/subscribe/' | relative_url }}">Subscribe</a>
      <a href="{{ '/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      <a href="{{ '/about/' | relative_url }}">About</a>
    </div>
  </footer>
</body>
</html>
