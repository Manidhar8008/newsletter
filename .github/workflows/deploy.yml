name: Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "_posts/**"
      - "_layouts/**"
      - "_includes/**"
      - "assets/**"
      - "about/**"
      - "archive/**"
      - "subscribe/**"
      - "founder-story/**"
      - "search/**"
      - "*.md"
      - "_config.yml"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
      - "scripts/**"
      - ".github/workflows/**"
  schedule:
    # Rebuild each morning so date-scheduled posts become public without a new commit.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      draft_mode:
        description: "Build draft posts for validation only; do not deploy them"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and audit Jekyll site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    env:
      JEKYLL_ENV: production
      DRAFT_MODE: ${{ inputs.draft_mode || false }}
    steps:
      - name: Check out newsletter source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Print runner and repository diagnostics
        run: |
          pwd
          ls -la
          df -h .
          echo "Commit: ${GITHUB_SHA}"
          git log -1 --pretty=format:'Commit message: %s%n'

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Ruby from .ruby-version and cache Bundler/Jekyll
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Report Ruby, Bundler, and Jekyll versions
        run: |
          ruby --version
          bundle --version
          bundle exec jekyll --version

      - name: Check dependency installation and audit Ruby gems
        run: |
          bundle check
          gem install bundler-audit --no-document
          bundle-audit check --update

      - name: Validate Jekyll configuration
        run: bundle exec jekyll doctor --trace

      - name: Clean previous Jekyll output
        run: bundle exec jekyll clean

      - name: Compile Jekyll to static HTML with build profiling
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ "$DRAFT_MODE" = "true" ]; then
            bundle exec jekyll build --drafts --profile --trace --strict_front_matter --baseurl "$PAGES_BASE_PATH"
          else
            bundle exec jekyll build --profile --trace --strict_front_matter --baseurl "$PAGES_BASE_PATH"
          fi

      - name: Audit generated pages, internal links, images, metadata, and RSS
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/check_site.py --site _site --baseurl "$PAGES_BASE_PATH"

      - name: Record build summary and artifact size
        run: |
          SITE_BYTES=$(du -sb _site | cut -f1)
          SITE_HUMAN=$(du -sh _site | cut -f1)
          {
            echo "## Newsletter build"
            echo
            echo "- Commit: `$GITHUB_SHA`"
            echo "- Commit message: $(git log -1 --pretty=%s)"
            echo "- Ruby: $(ruby --version)"
            echo "- Jekyll: $(bundle exec jekyll --version)"
            echo "- Site size: $SITE_HUMAN ($SITE_BYTES bytes)"
            echo "- Draft mode: $DRAFT_MODE"
            echo "- Build completed: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable GitHub Pages artifact
        if: inputs.draft_mode != true
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  deploy:
    name: Deploy verified artifact to GitHub Pages
    if: github.ref == 'refs/heads/main' && inputs.draft_mode != true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publish verified site artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployed URL
        run: |
          echo "Deployed newsletter: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
